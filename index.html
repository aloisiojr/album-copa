<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Álbum de Figurinhas 2026</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 10px; background-color: #cbd5e1; margin: 0; }
        h1 { text-align: center; color: #1e293b; font-size: 1.5rem; margin-bottom: 15px; text-transform: uppercase; }
        
        .sync-container { display: flex; justify-content: center; margin-bottom: 25px; }
        .btn-share { background-color: #25d366; color: white; padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .grupo { margin-bottom: 25px; background: #e2e8f0; padding: 12px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .grupo h2 { font-size: 1.2rem; margin: 0 0 15px 0; border-bottom: 2px solid #cbd5e1; padding-bottom: 8px; color: #1e3a8a; }
        
        .figurinhas-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .fig { 
            aspect-ratio: 1 / 1; border-radius: 6px; font-weight: 800; font-size: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 2px solid #94a3b8; background: #f8fafc; cursor: pointer;
        }
        .fig.tenho { background: #3b82f6; color: white; border-color: #2563eb; }
    </style>
</head>
<body>
    <h1>Meu Álbum 2026</h1>
    <div class="sync-container">
        <button class="btn-share" onclick="gerarSnapshot()">📲 Partilhar Álbum (WhatsApp)</button>
    </div>
    <div id="album-container"></div>

    <script>
        const estrutura = [
            { id: 'Inicio', nome: 'Início', prefixo: 'FWC', start: 1, end: 8 },
            { id: 'GrupoA', nome: 'Grupo A', equipes: ['MEX', 'RSA', 'KOR', 'CZE'] },
            { id: 'GrupoB', nome: 'Grupo B', equipes: ['CAN', 'BIH', 'QAT', 'SUI'] },
            { id: 'GrupoC', nome: 'Grupo C', equipes: ['BRA', 'MAR', 'HAI', 'SCO'] },
            { id: 'GrupoD', nome: 'Grupo D', equipes: ['USA', 'PAR', 'AUS', 'TUR'] },
            { id: 'GrupoE', nome: 'Grupo E', equipes: ['GER', 'CUW', 'CIV', 'ECU'] },
            { id: 'GrupoF', nome: 'Grupo F', equipes: ['NED', 'JPN', 'SWE', 'TUN'] },
            { id: 'GrupoG', nome: 'Grupo G', equipes: ['BEL', 'EGY', 'IRN', 'NZL'] },
            { id: 'GrupoH', nome: 'Grupo H', equipes: ['ESP', 'CPV', 'KSA', 'URU'] },
            { id: 'GrupoI', nome: 'Grupo I', equipes: ['FRA', 'SEN', 'IRQ', 'NOR'] },
            { id: 'GrupoJ', nome: 'Grupo J', equipes: ['ARG', 'ALG', 'AUT', 'JOR'] },
            { id: 'GrupoK', nome: 'Grupo K', equipes: ['POR', 'COD', 'UZB', 'COL'] },
            { id: 'GrupoL', nome: 'Grupo L', equipes: ['ENG', 'CRO', 'GHA', 'PAN'] },
            { id: 'Fim', nome: 'História (Museu FIFA)', prefixo: 'FWC', start: 9, end: 20 }
        ];

        function getOrdem() {
            let lista = [];
            estrutura.forEach(g => {
                if(g.equipes) {
                    g.equipes.forEach(pref => { for(let i=1; i<=20; i++) lista.push(pref + " " + i); });
                } else {
                    for(let i=g.start; i<=g.end; i++) lista.push(g.prefixo + " " + i);
                }
            });
            return lista;
        }

        function renderizar() {
            const container = document.getElementById('album-container');
            container.innerHTML = '';
            
            estrutura.forEach(g => {
                const divG = document.createElement('div');
                divG.className = 'grupo';
                divG.innerHTML = `<h2>${g.nome}</h2><div class="figurinhas-grid"></div>`;
                const grid = divG.querySelector('.figurinhas-grid');
                
                let itens = g.equipes ? g.equipes.flatMap(p => Array.from({length:20}, (_,i)=>p+" "+(i+1))) : Array.from({length:g.end-g.start+1}, (_,i)=>g.prefixo+" "+(i+g.start));

                itens.forEach(id => {
                    const el = document.createElement('div');
                    el.className = 'fig ' + (localStorage.getItem(id) === '1' ? 'tenho' : '');
                    el.innerText = id;
                    el.onclick = () => {
                        let novoEstado = localStorage.getItem(id) === '1' ? '0' : '1';
                        localStorage.setItem(id, novoEstado);
                        el.className = 'fig ' + (novoEstado === '1' ? 'tenho' : '');
                    };
                    grid.appendChild(el);
                });
                container.appendChild(divG);
            });
        }

        function gerarSnapshot() {
            let bin = getOrdem().map(id => localStorage.getItem(id) === '1' ? '1' : '0').join('');
            let hex = "";
            for(let i=0; i<bin.length; i+=4) hex += parseInt(bin.substr(i,4).padEnd(4,'0'), 2).toString(16);
            let url = window.location.origin + window.location.pathname + "?snapshot=" + hex;
            navigator.clipboard.writeText(url);
            alert("✅ Link copiado!");
        }

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const snap = params.get('snapshot');
            if(snap) {
                let bin = [...snap].map(h => parseInt(h,16).toString(2).padStart(4,'0')).join('');
                getOrdem().forEach((id, i) => localStorage.setItem(id, bin[i] || '0'));
                window.history.replaceState({}, '', window.location.pathname);
            }
            renderizar();
        };
    </script>
</body>
</html>
