<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Álbum de Figurinhas 2026</title>
    <style>
        body { font-family: sans-serif; padding: 10px; background-color: #cbd5e1; }
        .grupo { margin-bottom: 25px; background: #e2e8f0; padding: 10px; border-radius: 8px; }
        .figurinhas-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .fig { aspect-ratio: 1/1; border: 2px solid #ccc; background: white; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; }
        .fig.tenho { background: #3b82f6; color: white; border-color: #2563eb; }
        .btn-share { margin: 10px auto; display: block; padding: 10px; }
    </style>
</head>
<body>
    <button class="btn-share" onclick="gerarSnapshot()">🔗 Gerar Snapshot (Compartilhar)</button>
    <div id="album-container"></div>

    <script>
        // Lista na ordem exata que você quer percorrer
        const estrutura = [
            { id: 'Inicio', nome: 'Início', prefixo: 'FWC', start: 1, end: 8 },
            { id: 'GrupoA', nome: 'Grupo A', equipes: ['MEX', 'RSA', 'KOR', 'CZE'] },
            { id: 'GrupoB', nome: 'Grupo B', equipes: ['CAN', 'BIH', 'QAT', 'SUI'] },
            { id: 'GrupoC', nome: 'Grupo C', equipes: ['BRA', 'MAR', 'HAI', 'SCO'] },
            { id: 'GrupoD', nome: 'Grupo D', equipes: ['USA', 'PAR', 'AUS', 'TUR'] },
            { id: 'GrupoE', nome: 'Grupo E', equipes: ['GER', 'CUW', 'CIV', 'ECU'] },
            { id: 'GrupoF', nome: 'Grupo F', equipes: ['NED', 'JPN', 'SWE', 'TUN'] },
            { id: 'GrupoG', nome: 'Grupo G', equipes: ['BEL', 'EGY', 'IRN', 'NZL'] },
            { id: 'GrupoH', nome: 'Grupo H', equipes: ['ESP', 'CPV', 'KSA', 'URU'] },
            { id: 'GrupoI', nome: 'Grupo I', equipes: ['FRA', 'SEN', 'IRQ', 'NOR'] },
            { id: 'GrupoJ', nome: 'Grupo J', equipes: ['ARG', 'ALG', 'AUT', 'JOR'] },
            { id: 'GrupoK', nome: 'Grupo K', equipes: ['POR', 'COD', 'UZB', 'COL'] },
            { id: 'GrupoL', nome: 'Grupo L', equipes: ['ENG', 'CRO', 'GHA', 'PAN'] },
            { id: 'Fim', nome: 'História (Museu FIFA)', prefixo: 'FWC', start: 9, end: 20 }
        ];

        function getOrdem() {
            let lista = [];
            estrutura.forEach(g => {
                if(g.equipes) {
                    g.equipes.forEach(pref => { for(let i=1; i<=20; i++) lista.push(pref + " " + i); });
                } else {
                    for(let i=g.start; i<=g.end; i++) lista.push(g.prefixo + " " + i);
                }
            });
            return lista;
        }

        function renderizar() {
            const container = document.getElementById('album-container');
            container.innerHTML = '';
            const ordem = getOrdem();
            
            estrutura.forEach(g => {
                const divG = document.createElement('div');
                divG.className = 'grupo';
                divG.innerHTML = `<h2>${g.nome}</h2><div class="figurinhas-grid"></div>`;
                const grid = divG.querySelector('.figurinhas-grid');
                
                let range = g.equipes ? null : {s: g.start, e: g.end, p: g.prefixo};
                let itens = g.equipes ? g.equipes.flatMap(p => Array.from({length:20}, (_,i)=>p+" "+(i+1))) : Array.from({length:range.e-range.s+1}, (_,i)=>range.p+" "+(i+range.s));

                itens.forEach(id => {
                    const el = document.createElement('div');
                    el.className = 'fig ' + (localStorage.getItem(id) === '1' ? 'tenho' : '');
                    el.innerText = id;
                    el.onclick = () => {
                        let estado = localStorage.getItem(id) === '1' ? '0' : '1';
                        localStorage.setItem(id, estado);
                        el.className = 'fig ' + (estado === '1' ? 'tenho' : '');
                    };
                    grid.appendChild(el);
                });
                container.appendChild(divG);
            });
        }

        function gerarSnapshot() {
            const ordem = getOrdem();
            let bin = ordem.map(id => localStorage.getItem(id) === '1' ? '1' : '0').join('');
            let hex = "";
            for(let i=0; i<bin.length; i+=4) hex += parseInt(bin.substr(i,4).padEnd(4,'0'), 2).toString(16);
            let url = window.location.origin + window.location.pathname + "?snapshot=" + hex;
            prompt("Copie o link:", url);
        }

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const snap = params.get('snapshot');
            if(snap) {
                let bin = [...snap].map(h => parseInt(h,16).toString(2).padStart(4,'0')).join('');
                getOrdem().forEach((id, i) => localStorage.setItem(id, bin[i] || '0'));
            }
            renderizar();
        };
    </script>
</body>
</html>
