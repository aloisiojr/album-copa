<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Álbum de Figurinhas 2026</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 15px; background-color: #f4f4f9; margin: 0; user-select: none; -webkit-user-select: none; }
        h1 { text-align: center; color: #333; font-size: 1.5rem; margin-bottom: 20px; }
        
        .grupo { margin-bottom: 25px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .grupo h2 { font-size: 1.2rem; margin: 0 0 15px 0; border-bottom: 2px solid #eee; padding-bottom: 8px; color: #333; text-transform: uppercase; letter-spacing: 1px; }
        
        .selecao-titulo { font-size: 1rem; color: #666; margin: 15px 0 10px 0; font-weight: bold; }
        
        .figurinhas-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        
        .fig { 
            position: relative;
            width: calc(20% - 7px); /* 5 por linha */
            aspect-ratio: 1 / 1;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; font-weight: bold; font-size: 0.8rem;
            cursor: pointer; overflow: hidden;
            border: 2px solid var(--cor-tema);
            background: transparent;
            color: var(--cor-tema);
            opacity: 0.6;
            -webkit-touch-callout: none;
        }

        /* Estado "Faltando" (Destaque sólido) */
        .fig.faltando {
            background: var(--cor-tema);
            color: white;
            opacity: 1;
        }

        /* Animação do botão sendo segurado */
        .fig::after {
            content: ''; position: absolute;
            bottom: 0; left: 0; width: 100%; height: 0%;
            background: rgba(0, 0, 0, 0.3);
            transition: height 0s;
        }
        
        .fig.pressionando::after {
            height: 100%;
            transition: height 2s linear;
        }

    </style>
</head>
<body>
    <h1>Meu Álbum 2026</h1>
    <div id="album-container"></div>

    <script>
        // Estrutura do Álbum com Cores Baseadas na Imagem Oficial

            { id: 'GrupoB', nome: 'Grupo B', cor: '#d3222a', equipes: [{ prefixo: 'CAN', nome: 'Canadá', total: 20 }, { prefixo: 'BIH', nome: 'Bósnia e Herzegovina', total: 20 }, { prefixo: 'QAT', nome: 'Catar', total: 20 }, { prefixo: 'SUI', nome: 'Suíça', total: 20 }] },
            { id: 'GrupoC', nome: 'Grupo C', cor: '#ffcc00', equipes: [{ prefixo: 'BRA', nome: 'Brasil', total: 20 }, { prefixo: 'MAR', nome: 'Marrocos', total: 20 }, { prefixo: 'HAI', nome: 'Haiti', total: 20 }, { prefixo: 'SCO', nome: 'Escócia', total: 20 }] },
            { id: 'GrupoD', nome: 'Grupo D', cor: '#212869', equipes: [{ prefixo: 'USA', nome: 'EUA', total: 20 }, { prefixo: 'PAR', nome: 'Paraguai', total: 20 }, { prefixo: 'AUS', nome: 'Austrália', total: 20 }, { prefixo: 'TUR', nome: 'Turquia', total: 20 }] },
            { id: 'GrupoE', nome: 'Grupo E', cor: '#ea1b23', equipes: [{ prefixo: 'GER', nome: 'Alemanha', total: 20 }, { prefixo: 'CUW', nome: 'Curaçao', total: 20 }, { prefixo: 'CIV', nome: 'Costa do Marfim', total: 20 }, { prefixo: 'ECU', nome: 'Equador', total: 20 }] },
            { id: 'GrupoF', nome: 'Grupo F', cor: '#008761', equipes: [{ prefixo: 'NED', nome: 'Países Baixos', total: 20 }, { prefixo: 'JPN', nome: 'Japão', total: 20 }, { prefixo: 'SWE', nome: 'Suécia', total: 20 }, { prefixo: 'TUN', nome: 'Tunísia', total: 20 }] },
            { id: 'GrupoG', nome: 'Grupo G', cor: '#c7b6d1', equipes: [{ prefixo: 'BEL', nome: 'Bélgica', total: 20 }, { prefixo: 'EGY', nome: 'Egito', total: 20 }, { prefixo: 'IRN', nome: 'Irã', total: 20 }, { prefixo: 'NZL', nome: 'Nova Zelândia', total: 20 }] },
            { id: 'GrupoH', nome: 'Grupo H', cor: '#449999', equipes: [{ prefixo: 'ESP', nome: 'Espanha', total: 20 }, { prefixo: 'CPV', nome: 'Cabo Verde', total: 20 }, { prefixo: 'KSA', nome: 'Arábia Saudita', total: 20 }, { prefixo: 'URU', nome: 'Uruguai', total: 20 }] },
            { id: 'GrupoI', nome: 'Grupo I', cor: '#3a2674', equipes: [{ prefixo: 'FRA', nome: 'França', total: 20 }, { prefixo: 'SEN', nome: 'Senegal', total: 20 }, { prefixo: 'IRQ', nome: 'Iraque', total: 20 }, { prefixo: 'NOR', nome: 'Noruega', total: 20 }] },
            { id: 'GrupoJ', nome: 'Grupo J', cor: '#f37861', equipes: [{ prefixo: 'ARG', nome: 'Argentina', total: 20 }, { prefixo: 'ALG', nome: 'Argélia', total: 20 }, { prefixo: 'AUT', nome: 'Áustria', total: 20 }, { prefixo: 'JOR', nome: 'Jordânia', total: 20 }] },
            { id: 'GrupoK', nome: 'Grupo K', cor: '#dc1f26', equipes: [{ prefixo: 'POR', nome: 'Portugal', total: 20 }, { prefixo: 'COD', nome: 'Congo DR', total: 20 }, { prefixo: 'UZB', nome: 'Uzbequistão', total: 20 }, { prefixo: 'COL', nome: 'Colômbia', total: 20 }] },
            { id: 'GrupoL', nome: 'Grupo L', cor: '#b01c20', equipes: [{ prefixo: 'ENG', nome: 'Inglaterra', total: 20 }, { prefixo: 'CRO', nome: 'Croácia', total: 20 }, { prefixo: 'GHA', nome: 'Gana', total: 20 }, { prefixo: 'PAN', nome: 'Panamá', total: 20 }] }
        ];

        // Nossa lista base consolidada nas mensagens (faltantes default)
        const faltantesBase = [
            "FWC 3", "FWC 6", "ENG 6", "ENG 12", "ENG 14", "ENG 15", "ENG 16", "ENG 19", "ENG 20", "GHA 1", "GHA 3", "GHA 4", "GHA 7", "GHA 8", "CRO 5", "CRO 7", "CRO 8", "CRO 9", "CRO 12", "CRO 14", "CRO 17", "CRO 19", "COL 3", "COL 4", "COL 5", "COL 6", "COL 7", "COL 12", "COL 14", "COL 16", "COL 19", "COL 20", "PAN 3", "PAN 4", "PAN 5", "PAN 7", "PAN 15", "UZB 2", "UZB 19", "UZB 20", "POR 1", "POR 2", "POR 6", "POR 7", "POR 9", "POR 10", "POR 11", "POR 12", "POR 16", "POR 17", "POR 18", "POR 20", "COD 6", "COD 7", "COD 12", "COD 17", "COD 20", "JOR 2", "JOR 6", "JOR 10", "JOR 20", "AUT 3", "AUT 5", "AUT 6", "AUT 7", "AUT 9", "AUT 14", "AUT 18", "KSA 1", "KSA 2", "KSA 5", "KSA 6", "KSA 10", "KSA 11", "URU 16", "FRA 1", "FRA 11", "FRA 13", "FRA 15", "FRA 16", "FRA 17", "SEN 1", "SEN 6", "SEN 10", "SEN 15", "IRQ 5", "IRQ 11", "IRQ 14", "IRQ 16", "IRQ 17", "IRQ 18", "IRQ 20", "NOR 3", "NOR 5", "NOR 8", "NOR 9", "NOR 12", "NOR 17", "ARG 6", "ARG 10", "ARG 15", "ARG 18", "ALG 1", "ALG 4", "ESP 4", "ESP 5", "ESP 8", "ESP 9", "ESP 12", "ESP 20", "EGY 1", "EGY 2", "EGY 3", "EGY 6", "EGY 8", "EGY 10", "EGY 12", "NED 4", "NED 5", "NED 6", "NED 10", "NED 12", "NED 14", "NED 15", "NED 17", "NED 18", "JPN 3", "JPN 4", "JPN 6", "JPN 10", "JPN 12", "JPN 15", "JPN 17", "JPN 18", "SWE 1", "SWE 3", "SWE 6", "TUN 1", "TUN 10", "TUN 19", "BEL 5", "BEL 6", "BEL 8", "BEL 14", "BEL 15", "BEL 16", "BEL 17", "CPV 2", "CPV 4", "CPV 5", "CPV 7", "CPV 8", "CPV 9", "CPV 12", "CPV 13", "CPV 14", "CPV 18", "IRN 1", "IRN 2", "IRN 3", "IRN 5", "IRN 6", "IRN 7", "IRN 9", "IRN 10", "IRN 11", "IRN 14", "IRN 15", "IRN 16", "IRN 20", "NZL 5", "NZL 11", "NZL 12", "NZL 16", "GER 6", "GER 8", "GER 10", "GER 16", "GER 18", "GER 19", "ECU 1", "ECU 2", "ECU 6", "ECU 8", "ECU 13", "ECU 18", "HAI 1", "HAI 8", "HAI 19", "SCO 9", "SCO 14", "SCO 18", "USA 5", "USA 6", "USA 16", "PAR 4", "PAR 6", "PAR 8", "PAR 12", "PAR 19", "AUS 3", "AUS 4", "AUS 7", "AUS 8", "AUS 10", "AUS 11", "AUS 15", "AUS 16", "AUS 18", "AUS 19", "TUR 1", "TUR 10", "TUR 11", "TUR 16", "TUR 18", "CUW 1", "CUW 4", "CUW 5", "CUW 6", "CUW 8", "CUW 10", "CUW 12", "CUW 15", "CUW 17", "CUW 19", "CIV 2", "CIV 6", "CIV 9", "CIV 10", "CIV 13", "CIV 15", "CIV 18", "CIV 19", "MAR 1", "MAR 4", "MAR 5", "MAR 8", "MAR 9", "MAR 17", "MAR 19", "MEX 2", "MEX 8", "MEX 10", "MEX 11", "MEX 12", "MEX 15", "MEX 19", "MEX 20", "RSA 1", "RSA 8", "RSA 15", "RSA 17", "KOR 1", "KOR 2", "KOR 8", "KOR 19", "KOR 20", "CZE 10", "CZE 12", "CZE 14", "CZE 19", "CAN 10", "CAN 17", "BIH 5", "BIH 6", "BIH 10", "QAT 4", "QAT 5", "QAT 6", "QAT 19", "SUI 2", "SUI 4", "SUI 6", "SUI 13", "BRA 2", "BRA 4", "BRA 6", "BRA 15"
        ];

        // Lógica de segurar (Long Press)
        let timer;
        const duracaoHold = 2000; // 2 segundos

        function isFaltando(id) {
            const salvo = localStorage.getItem(id);
            if (salvo !== null) return salvo === 'true'; 
            return faltantesBase.includes(id); 
        }

        function toggleSticker(id, elemento) {
            const atualFaltando = isFaltando(id);
            localStorage.setItem(id, (!atualFaltando).toString());
            
            if (!atualFaltando) {
                elemento.classList.add('faltando');
            } else {
                elemento.classList.remove('faltando');
            }
        }

        function renderizar() {
            const container = document.getElementById('album-container');
            
            albumData.forEach(grupo => {
                const divGrupo = document.createElement('div');
                divGrupo.className = 'grupo';
                divGrupo.innerHTML = `<h2 style="color: ${grupo.cor}">${grupo.nome}</h2>`;
                
                grupo.equipes.forEach(equipe => {
                    const divEquipe = document.createElement('div');
                    divEquipe.innerHTML = `<div class="selecao-titulo">${equipe.nome} (${equipe.prefixo})</div>`;
                    
                    const grid = document.createElement('div');
                    grid.className = 'figurinhas-grid';
                    
                    for (let i = 1; i <= equipe.total; i++) {
                        const figId = `${equipe.prefixo} ${i}`;
                        const divFig = document.createElement('div');
                        divFig.className = 'fig';
                        divFig.innerText = i;
                        divFig.style.setProperty('--cor-tema', grupo.cor);
                        
                        if (isFaltando(figId)) {
                            divFig.classList.add('faltando');
                        }

                        // Eventos para segurar e soltar (Mobile e PC)
                        const startPress = (e) => {
                            e.preventDefault();
                            divFig.classList.add('pressionando');
                            timer = setTimeout(() => {
                                toggleSticker(figId, divFig);
                                divFig.classList.remove('pressionando');
                            }, duracaoHold);
                        };

                        const cancelPress = () => {
                            clearTimeout(timer);
                            divFig.classList.remove('pressionando');
                        };

                        divFig.addEventListener('touchstart', startPress, {passive: false});
                        divFig.addEventListener('touchend', cancelPress);
                        divFig.addEventListener('touchcancel', cancelPress);
                        
                        divFig.addEventListener('mousedown', startPress);
                        divFig.addEventListener('mouseup', cancelPress);
                        divFig.addEventListener('mouseleave', cancelPress);
                        divFig.addEventListener('contextmenu', e => e.preventDefault());

                        grid.appendChild(divFig);
                    }
                    divEquipe.appendChild(grid);
                    divGrupo.appendChild(divEquipe);
                });
                container.appendChild(divGrupo);
            });
        }

        renderizar();
    </script>
</body>
</html>
